name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk taskmgr-${GITHUB_REF_NAME}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "taskmgr ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## taskmgr ${{ github.ref_name }}

            ### Destaques desta versão
            - **Novo pacote exclusivo (`com.jovij.taskmgr`):**
              - Migração do pacote/applicationId de `com.example.taskmgr` para `com.jovij.taskmgr`, eliminando conflitos de pacotes existentes em dispositivos Xiaomi (MIUI/HyperOS) e outros fabricantes.
            - **Matriz de Eisenhower mais limpa ao longo do tempo:**
              - Apenas tarefas ainda não concluídas e tarefas concluídas hoje são exibidas nos quadrantes da Matriz.
              - Tarefas concluídas em dias anteriores permanecem registradas e consultáveis normalmente na tela de **Calendário**.
            - **Tela de Configurações & Sobre:**
              - Removido o subtítulo com versão hardcoded e autoria do item **Sobre** no menu de Configurações.
              - A tela **Sobre** exibe dinamicamente a versão instalada do aplicativo.
            - **Matriz de Eisenhower 2x2, Planejar o Dia & Lembretes Antecipados:**
              - Visualização em 4 quadrantes com criação direta respeitando a urgência do quadrante.
              - Tarefas com data e horário opcionais, modal **"Planejar o dia"** para delegar a Caixa de entrada e múltiplos lembretes antecipados customizáveis com notificação de tela inteira.
          files: |
            taskmgr-${{ github.ref_name }}.apk
