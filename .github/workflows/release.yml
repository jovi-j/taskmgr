name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk taskmgr-${GITHUB_REF_NAME}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "taskmgr ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## taskmgr ${{ github.ref_name }}

            ### Destaques desta versão
            - **Interface Focus OLED Dark (`#000000`)** com Jetpack Compose, Material 3, transições animadas e fontes Ubuntu Sans Nerd Font.
            - **5 Abas Principais:** Hoje, Calendário (com edição retroativa e cálculo de sequências/recordes), Grupos de Hábitos (com mais de 180 ícones Nerd Font pesquisáveis e fundo circular colorido), Momentos (com repetição `H:` / `M:` e fim às `00:00` no mesmo dia) e Configurações divididas em subtelas.
            - **Alarmes em Tela Cheia & Soneca:** Disparo sobre a tela bloqueada com vibração configurável e 6 opções de soneca (`5m`, `10m`, `30m`, `1h`, `3h`, `Até amanhã`).
            - **Exportação, Sincronização e Importação:**
              - Sincronização de tarefas com o Google Agenda / Calendário do Android.
              - Backup e restauração completa via `.taskmgr.md`.
              - Exportação e importação de checklists GitHub Flavored Markdown (`.md`) para Notion e Obsidian.
          files: |
            taskmgr-${{ github.ref_name }}.apk
