name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk taskmgr-${GITHUB_REF_NAME}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "taskmgr ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## taskmgr ${{ github.ref_name }}

            ### Destaques desta versão
            - **Matriz de Eisenhower 2x2 & Planejar o Dia:**
              - Visualização em 4 quadrantes (Importante e Urgente - Vermelho, Importante e Não Urgente - Amarelo, Não Importante e Urgente - Verde, Não Importante e Não Urgente - Azul).
              - Tarefas sem obrigatoriedade de data e horário (Caixa de entrada em Urgência Baixa por padrão, ou na urgência do quadrante clicado).
              - Modal **"Planejar o dia"** na Matriz para revisar e delegar tarefas sem data/hora para uma data e quadrante específicos.
            - **Lembretes Antecipados Customizáveis para Tarefas:**
              - Configuração de múltiplos lembretes X tempo antes do horário do evento (dias, horas, minutos antes e frequência de repetição).
              - Notificação de tela inteira para tarefas apenas com a opção **"Sim"** (sem opções de soneca), mantendo o usuário ciente da chegada do evento.
            - **Interface Focus OLED Dark (`#000000`)** com Jetpack Compose, Material 3, transições animadas e fontes Ubuntu Sans Nerd Font.
            - **Exportação, Sincronização e Importação:**
              - Sincronização de tarefas agendadas com o Google Agenda / Calendário do Android.
              - Backup e restauração completa via `.taskmgr.md` e checklists GFM (`.md`) para Notion e Obsidian.
          files: |
            taskmgr-${{ github.ref_name }}.apk
