name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk taskmgr-${GITHUB_REF_NAME}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "taskmgr ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## taskmgr ${{ github.ref_name }}

            ### Destaques desta versão
            - **Limite de 3 Minutos de Toque e Soneca Automática Exponencial (`AutoSnoozePolicy`):**
              - Quando um alarme/notificação toca por **3 minutos** sem interação, a vibração e a tela cheia são encerradas automaticamente para economizar bateria e é aplicada uma soneca automática de **5 minutos**.
              - Caso o usuário continue sem interagir nas tentativas seguintes, o tempo de espera dobra progressivamente (`5 min` → `10 min` → `20 min` → `40 min`...).
              - Quando a próxima soneca ultrapassaria o fim do momento ou cairia na madrugada do dia seguinte, as tentativas extras do dia atual são encerradas, mantendo o agendamento normal do momento/horário no próximo dia ativo.
            - **Botão Central Destacado "Hoje" na Barra Inferior (`MainScreen`):**
              - A aba **Hoje** fica posicionada no centro da barra inferior dentro de um botão circular com cores invertidas e ícone de sol (`nf-weather-day_sunny`).
            - **Widget de Hábito com Suporte a 2 Linhas (`HabitGlanceWidget`):**
              - O título do hábito no widget da tela inicial exibe até 2 linhas completas com reticências (`...`).
            - **Detector de Texto Inteligente em Títulos, 4 Momentos Padrões, Editores por Modais & Widgets Glance (2x2 e 4x2).**
          files: |
            taskmgr-${{ github.ref_name }}.apk
