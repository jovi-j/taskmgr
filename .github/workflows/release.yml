name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk taskmgr-${GITHUB_REF_NAME}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "taskmgr ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## taskmgr ${{ github.ref_name }}

            ### Destaques desta versão
            - **Botão Central Destacado "Hoje" na Barra Inferior (`MainScreen`):**
              - A aba **Hoje** agora fica posicionada no centro da barra inferior (`Calendário`, `Matriz`, `Hoje`, `Grupos`, `Momentos`), dentro de um botão circular com cores invertidas e ícone de sol (`nf-weather-day_sunny`).
            - **Widget de Hábito com Suporte a 2 Linhas (`HabitGlanceWidget`):**
              - O título do hábito no widget da tela inicial exibe até 2 linhas completas, truncando com reticências (`...`) quando o texto ultrapassa esse limite.
            - **Detector de Texto Inteligente em Títulos (Tarefas e Hábitos):**
              - Reconhecimento automático (case-insensitive e sem acentuação) de data de início (`23/11/2026`, `amanhã`, `depois de amanhã`), data fim (`até 23/12/2026`), horário (`às 15:00`), frequência semanal (`toda segunda e terça`), frequência de hábito (`2x ao dia`, `250 ml de 2500 ml ao dia`), período (`pela manhã`, `pela tarde`, `pela noite`), urgência (`urgencia muito alta`) e grupo (`grupo casa`, `grupo saúde`).
              - Trechos reconhecidos ficam destacados em azul com fundo escuro; pressionar **Backspace/Delete** logo após o trecho mantém o texto literal no título e reverte a alteração automática.
            - **4 Momentos Padrões, Frequência/Data Fim em Tarefas, Editores por Modais & Widgets Glance (2x2 e 4x2).**
          files: |
            taskmgr-${{ github.ref_name }}.apk
